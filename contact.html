  <h2 style="color: #d8ad55;">Contact Our Legal Team</h2>
  <p>Please fill out the form below to schedule a consultation.</p>

  <form action="#" method="post">
    
   
    <p>
      <label for="fullname"; style="color: #ffffff;">Full Name *</label><br>
      <input type="text" id="fullname" name="fullname" required placeholder="Full Name">
    </p>

   
    <p>
      <label for="email"; style="color: #ffffff;">Email Address *</label><br>
      <input type="email" id="email" name="email" required placeholder="abdallah@gmail.com">
    </p>


    <p>
      <label for="phone"; style="color: #ffffff;">Phone Number</label><br>
      <input type="tel" id="phone" name="phone" placeholder="(230) 1515-6546">
    </p>

   
    <p>
      <label for="practice_area"; style="color: #ffffff;">Practice Area *</label><br>
      <select id="practice_area" name="practice_area" required>
        <option value="" disabled selected>-- Select a Practice Area --</option>
        <option value="Family Law">Family Law</option>
        <option value="Criminal Law">Criminal Law</option>
        <option value="Labour/Employment Law">Labour/Employment Law</option>
        <option value="Tenancy and Rental Law">Tenancy and Rental Law</option>
        <option value="Commercial Law">Commercial Law</option>
        <option value="Contractual Disputes">Contractual Disputes</option>
        <option value="Litigation and Arbitration">Litigation and Arbitration</option>
        <option value="Mediation">Mediation</option>
        <option value="Contract Drafting">Contract Drafting</option>
      </select>
    </p>

    <p>
      <label for="message"; style="color: #ffffff;">Message *</label><br>
      <textarea id="message" name="message" rows="5" cols="40" required placeholder="Please describe your legal legal matter..."></textarea>
    </p>


    <p>
      <input type="checkbox" id="consent" name="consent" required>
      <label for="consent"; style="color: #ffffff;">I consent to having this website store my submitted information so they can respond to my inquiry. *</label>
    </p>

   
    <p>
      <button type="submit" style="background-color: #d8ad55; color: #061a33; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; transition: background-color 0.2s ease; ">Submit Request</button>
    </p>

  </form>
